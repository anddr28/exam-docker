{% extends "base.html" %}
{% block title %}Каталог — Книжный магазин{% endblock %}
{% block content %}
<h1>Каталог книг</h1>
<div class="grid">
  {% for book in books %}
  <div class="card">
    <h3><a href="/books/{{ book.id }}">{{ book.title }}</a></h3>
    <p class="price">{{ book.price }} ₽</p>
    <p class="muted">В наличии: {{ book.stock }} шт.</p>
    <a class="btn" href="/books/{{ book.id }}">Подробнее</a>
  </div>
  {% else %}
  <p>Каталог пуст.</p>
  {% endfor %}
</div>
{% endblock %}

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжный магазин{% endblock %}</title>
  <style>
    :root {
      --text: #1c1c1c;
      --muted: #707070;
      --line: #e3e3e3;
      --bg: #ffffff;
      --soft: #f6f6f4;
      --link: #1f4e79;
      --err: #a12622;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

    header { border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: baseline; gap: 24px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
    .brand { font-weight: 600; color: var(--text); margin-right: auto; }
    .brand:hover { text-decoration: none; }
    nav a { color: var(--muted); margin-left: 20px; }
    nav a:first-child { margin-left: 0; }
    nav a.active { color: var(--text); }

    main { padding: 32px 0 64px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 24px; }
    .muted { color: var(--muted); }
    .back { display: inline-block; margin-bottom: 20px; font-size: 14px; }

    table { width: 100%; border-collapse: collapse; }
    th { font-size: 13px; font-weight: 500; color: var(--muted); text-align: left; padding: 0 12px 8px 0; border-bottom: 1px solid var(--text); }
    td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    th.num, td.num { padding-right: 0; padding-left: 12px; }

    dl { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; margin: 0 0 28px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; }

    .btn {
      display: inline-block; padding: 9px 18px; border: 1px solid var(--text); border-radius: 3px;
      background: var(--text); color: #fff; font: inherit; cursor: pointer;
    }
    .btn:hover { background: #000; text-decoration: none; }
    .btn.disabled { background: none; color: var(--muted); border-color: var(--line); pointer-events: none; }

    form { max-width: 440px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
    select, input { width: 100%; padding: 9px 10px; font: inherit; border: 1px solid #c9c9c9; border-radius: 3px; background: #fff; margin-bottom: 18px; }
    select:focus, input:focus { outline: 2px solid var(--link); outline-offset: -1px; }
    .error { border-left: 3px solid var(--err); background: #fbf1f0; color: var(--err); padding: 10px 14px; margin-bottom: 20px; }
    .empty { padding: 32px 0; color: var(--muted); }

    footer { border-top: 1px solid var(--line); padding: 18px 0; font-size: 13px; color: var(--muted); }

    @media (max-width: 560px) {
      dl { grid-template-columns: 1fr; gap: 2px; }
      dd { margin-bottom: 10px; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">Книжный магазин</a>
      {% set path = request.url.path %}
      <nav>
        <a href="/" class="{{ 'active' if path == '/' or path.startswith('/books') }}">Каталог</a>
        <a href="/orders" class="{{ 'active' if path.startswith('/orders') and path != '/orders/new' }}">Заказы</a>
        <a href="/orders/new" class="{{ 'active' if path == '/orders/new' }}">Оформить</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer>
    <div class="wrap">FastAPI · PostgreSQL · Docker &nbsp;—&nbsp; <a href="/docs">документация API</a></div>
  </footer>
</body>
</html>

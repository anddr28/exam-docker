{% extends "base.html" %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
<p><a href="/">← К каталогу</a></p>
<div class="card">
  <h1>{{ book.title }}</h1>
  <p class="muted">Артикул: #{{ book.id }}</p>
  <p class="price">{{ book.price }} ₽</p>
  <p>В наличии: <b>{{ book.stock }}</b> шт.</p>
  <a class="btn" href="/orders/new?book_id={{ book.id }}"
     {% if book.stock == 0 %}aria-disabled="true"{% endif %}>
    {% if book.stock > 0 %}Заказать{% else %}Нет в наличии{% endif %}
  </a>
</div>
{% endblock %}
